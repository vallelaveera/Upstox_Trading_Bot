<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <!-- Hexagon background -->
  <polygon points="20,2 35,11 35,29 20,38 5,29 5,11" fill="#0a0a0a" stroke="#FBBF24" stroke-width="1.5"/>
  <!-- Circuit corner marks -->
  <line x1="5" y1="11" x2="2" y2="8" stroke="#FBBF24" stroke-width="0.8" opacity="0.6"/>
  <line x1="35" y1="11" x2="38" y2="8" stroke="#FBBF24" stroke-width="0.8" opacity="0.6"/>
  <line x1="5" y1="29" x2="2" y2="32" stroke="#FBBF24" stroke-width="0.8" opacity="0.6"/>
  <line x1="35" y1="29" x2="38" y2="32" stroke="#FBBF24" stroke-width="0.8" opacity="0.6"/>
  <!-- Oscilloscope waveform -->
  <polyline points="8,20 11,20 13,14 15,26 17,18 19,22 21,20 23,14 25,26 27,20 32,20"
    fill="none" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Glow dot at end -->
  <circle cx="32" cy="20" r="1.2" fill="#FBBF24"/>
</svg>
